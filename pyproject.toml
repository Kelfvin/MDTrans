[project]
name = "mdtrans"
version = "0.1.0"
description = "Convert PDFs with MinerU and translate the generated Markdown into Simplified Chinese."
readme = "README.md"
requires-python = ">= 3.11"
authors = [
    { name = "kelf", email = "kelfvin@163.com" },
]
keywords = ["pdf", "markdown", "translation", "mineru", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    "httpx[socks]>=0.28.1",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.35",
    "markdown-it-py>=4.0.0",
    "mineru[core,vllm]>=3.0.9",
    "tiktoken>=0.12.0",
]

[project.scripts]
mdtrans = "mdtrans.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["mdtrans", "README.md", "README.zh.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
include = ["mdtrans"]
